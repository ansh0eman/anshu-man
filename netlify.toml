[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/api/spotify/now-playing"
to = "/.netlify/functions/spotify-now-playing"
status = 200
force = true

[[redirects]]
from = "https://setuai.ansh0eman.in/"
to = "/projects/setuai/"
status = 200
force = true

[[redirects]]
from = "/posts/first_blog_post"
to = "/posts/mom-why-dont-i-have-a-surname/"
status = 301

[[redirects]]
from = "/posts/second_blog_post"
to = "/posts/playing-with-neural-style-transfer/"
status = 301

[[redirects]]
from = "/posts/third_blog_post"
to = "/posts/cogito-ergo-sum/"
status = 301
